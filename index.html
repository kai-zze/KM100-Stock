                  condition: newStatus,
                  updatedAt: new Date().toISOString()
                });
              }
              return it;
            });
          });
          setSelectedItemIds([]);
          showToast('Updated status of ' + count + ' items to "' + newStatus + '"');
        }

        function handleBulkDelete() {
          var count = selectedItemIds.length;
          if (count === 0) return;
          var selectedItemsList = items.filter(function(it) { return selectedItemIds.indexOf(it.id) !== -1; });
          var totalUnits = selectedItemsList.reduce(function(acc, it) { return acc + (Number(it.quantity) || 0); }, 0);
          var sampleNames = selectedItemsList.slice(0, 3).map(function(it) { return it.name; });
          var remainingCount = count - sampleNames.length;

          setConfirmDialog({
            title: 'Delete ' + count + ' Selected Items',
            message: 'You are about to permanently delete ' + count + ' items (' + totalUnits + ' total units) from the inventory system.',
            isDestructive: true,
            actionLabel: 'Permanently Delete ' + count + ' Items',
            bulkPreview: {
              count: count,
              totalUnits: totalUnits,
              sampleNames: sampleNames,
              remainingCount: remainingCount
            },
            onConfirm: function() {
              setItems(function(prev) {
                return prev.filter(function(it) { return selectedItemIds.indexOf(it.id) === -1; });
              });
              setSelectedItemIds([]);
              setConfirmDialog(null);
              showToast('Deleted ' + count + ' items from inventory');
            }
          });
        }

        // Two-Way Excel Import (.xlsx / .xls)
        function triggerExcelImport() {
          var el = document.getElementById('excel-file-input');
          if (el) el.click();
        }

        function processExcelFile(file) {
          if (!file) return;

          if (!window.XLSX) {
            showToast('Excel engine still loading � please try again in a moment.', 'error');
            return;
          }

          var reader = new FileReader();
          reader.onload = function(evt) {
            try {
              var data = new Uint8Array(evt.target.result);
              var workbook = XLSX.read(data, { type: 'array' });
              
              var allParsedItems = [];
              var discoveredRooms = {};
              var sheetBreakdown = [];

              workbook.SheetNames.forEach(function(sheetName) {
                var worksheet = workbook.Sheets[sheetName];
                if (!worksheet) return;
                var rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                if (!rawRows || rawRows.length === 0) return;

                // Locate header row index
                var headerRowIndex = -1;
                var colMap = {};

                for (var i = 0; i < Math.min(25, rawRows.length); i++) {
                  var r = rawRows[i];
                  if (!r || !r.length) continue;
                  for (var j = 0; j < r.length; j++) {
                    var cell = String(r[j]).trim().toUpperCase();
                    if (
                      cell === 'ITEM NAME' || cell === 'ITEM' || cell === 'NAME' ||
                      cell === 'EQUIPMENT' || cell === 'DESCRIPTION' || cell === 'PARTICULAR' ||
                      cell === 'PARTICULARS' || cell === 'TOOL' || cell === 'ARTICLE' || cell === 'PRODUCT'
                    ) {
                      headerRowIndex = i;
                      break;
                    }
                  }
                  if (headerRowIndex !== -1) {
                    rawRows[headerRowIndex].forEach(function(hCell, idx) {
                      var norm = String(hCell).trim().toUpperCase();
                      if (norm.indexOf('ITEM') !== -1 || norm === 'NAME' || norm.indexOf('DESC') !== -1 || norm.indexOf('PARTICULAR') !== -1 || norm.indexOf('EQUIP') !== -1 || norm === 'TOOL') {
                        if (colMap.name === undefined) colMap.name = idx;
                      } else if (norm.indexOf('CAT') !== -1 || norm.indexOf('TYPE') !== -1 || norm.indexOf('CLASS') !== -1) {
                        if (colMap.category === undefined) colMap.category = idx;
                      } else if (norm.indexOf('QTY') !== -1 || norm.indexOf('QUANTITY') !== -1 || norm.indexOf('COUNT') !== -1 || norm.indexOf('TOTAL') !== -1) {
                        if (colMap.quantity === undefined) colMap.quantity = idx;
                      } else if (norm.indexOf('UNIT') !== -1 || norm.indexOf('UOM') !== -1 || norm.indexOf('MEASURE') !== -1) {
                        if (colMap.units === undefined) colMap.units = idx;
                      } else if (norm.indexOf('STAT') !== -1 || norm.indexOf('COND') !== -1 || norm.indexOf('REMARK') !== -1) {
                        if (colMap.status === undefined) colMap.status = idx;
                      } else if (norm.indexOf('ROOM') !== -1 || norm.indexOf('LOC') !== -1 || norm.indexOf('FACILITY') !== -1 || norm.indexOf('AREA') !== -1) {
                        if (colMap.room === undefined) colMap.room = idx;
                      }
                    });
                    break;
                  }
                }

                // If no standard header row found, test if row 0 has data
                if (headerRowIndex === -1 && rawRows.length > 0) {
                  headerRowIndex = 0;
                  colMap = { name: 0, category: 1, quantity: 2, units: 3, status: 4 };
                }

                if (colMap.name === undefined) return;

                var sheetItemsCount = 0;
                var defaultRoomForSheet = sheetName.indexOf('Sheet') === 0 ? 'Contact Center Services' : sheetName;

                for (var rowIdx = headerRowIndex + 1; rowIdx < rawRows.length; rowIdx++) {
                  var rowData = rawRows[rowIdx];
                  if (!rowData || !rowData.length) continue;
                  var itemName = String(rowData[colMap.name] || '').trim();
                  if (!itemName || itemName.toUpperCase() === 'ITEM NAME' || itemName.toUpperCase().indexOf('TOTAL') !== -1 || itemName.toUpperCase().indexOf('ACCOUNTING') !== -1) continue;

                  var rName = colMap.room !== undefined ? String(rowData[colMap.room] || '').trim() : '';
                  if (!rName) rName = defaultRoomForSheet;
                  discoveredRooms[rName] = (discoveredRooms[rName] || 0) + 1;

                  // Normalize condition to KM100 standard
                  var rawStatus = colMap.status !== undefined ? String(rowData[colMap.status] || 'Working').trim() : 'Working';
                  var normStatus = 'Working';
                  var lowerS = rawStatus.toLowerCase();
                  if (lowerS.indexOf('def') !== -1 || lowerS.indexOf('dmg') !== -1 || lowerS.indexOf('broken') !== -1 || lowerS.indexOf('bad') !== -1 || lowerS.indexOf('repair') !== -1) {
                    normStatus = 'Defective';
                  } else if (lowerS.indexOf('used') !== -1 || lowerS.indexOf('fair') !== -1 || lowerS.indexOf('wear') !== -1 || lowerS.indexOf('moderate') !== -1) {
                    normStatus = 'Used';
                  } else if (lowerS.indexOf('empty') !== -1 || lowerS.indexOf('out') !== -1 || lowerS.indexOf('zero') !== -1 || lowerS.indexOf('deplet') !== -1) {
                    normStatus = 'Empty';
                  } else {
                    normStatus = 'Working';
                  }

                  var rawQtyStr = colMap.quantity !== undefined ? String(rowData[colMap.quantity]) : '1';
                  var cleanQtyNum = parseFloat(rawQtyStr.replace(/[^0-9.-]/g, ''));
                  var qtyVal = !isNaN(cleanQtyNum) ? Math.max(0, cleanQtyNum) : 1;

                  var unitVal = colMap.units !== undefined ? String(rowData[colMap.units] || 'pcs').trim() : 'pcs';
                  if (!unitVal) unitVal = 'pcs';

                  var catVal = colMap.category !== undefined ? String(rowData[colMap.category] || 'Tools').trim() : 'Tools';
                  if (!catVal) catVal = 'Tools';

                  allParsedItems.push({
                    id: 'km100-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7) + '-' + rowIdx,
                    name: itemName,
                    category: catVal,
                    quantity: qtyVal,
                    units: unitVal,
                    status: normStatus,
                    condition: normStatus,
                    room: rName,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                  });
                  sheetItemsCount++;
                }

                if (sheetItemsCount > 0) {
                  sheetBreakdown.push({ sheetName: sheetName, count: sheetItemsCount });
                }
              });

              if (allParsedItems.length === 0) {
                showToast('No valid inventory items found in the spreadsheet. Check the file format.', 'error');
                return;
              }

              // Set preview modal with complete conversion stats
              setImportPreview({
                fileName: file.name,
                fileSize: (file.size / 1024).toFixed(1) + ' KB',
                totalItems: allParsedItems.length,
                sheetBreakdown: sheetBreakdown,
                roomsList: Object.keys(discoveredRooms),
                roomCounts: discoveredRooms,
                parsedItems: allParsedItems,
                samplePreview: allParsedItems.slice(0, 5)
              });

            } catch(err) {
              console.error('Import error:', err);
              showToast('Error converting spreadsheet: ' + err.message, 'error');
            }
          };
          reader.readAsArrayBuffer(file);
        }

        function handleExcelFileSelected(e) {
          var file = e.target.files && e.target.files[0];
          if (!file) return;
          processExcelFile(file);
          e.target.value = '';
        }

        function executeImport(mode) {
          if (!importPreview) return;
          var newItems = importPreview.parsedItems;
          var newRoomNames = importPreview.roomsList;

          // Ensure rooms exist
          var updatedRooms = rooms.slice();
          var roomMap = {};
          updatedRooms.forEach(function(r) { roomMap[r.name.toLowerCase()] = r.id; });

          // If adding to current room specifically
          if (mode === 'current-room') {
            var targetRoom = (selectedRoomId === 'ALL' || !currentRoom) ? updatedRooms[0] : currentRoom;
            newItems = newItems.map(function(it) {
              return Object.assign({}, it, { roomId: targetRoom.id, room: targetRoom.name });
            });
            setItems(function(prev) { return newItems.concat(prev); });
            showToast('Directly added ' + newItems.length + ' items to ' + targetRoom.name, 'success');
          } else {
            // Auto-detect and register any new facility rooms
            newRoomNames.forEach(function(rn) {
              var key = rn.toLowerCase();
              if (!roomMap[key]) {
                var newId = 'room-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
                updatedRooms.push({ id: newId, name: rn, description: rn + ' Facility' });
                roomMap[key] = newId;
              }
            });

            // Map roomId into items
            newItems = newItems.map(function(it) {
              var rId = roomMap[it.room.toLowerCase()] || updatedRooms[0].id;
              return Object.assign({}, it, { roomId: rId });
            });

            if (mode === 'replace') {
              setRooms(updatedRooms);
              setItems(newItems);
              showToast('Replaced inventory with ' + newItems.length + ' items from Excel', 'success');
            } else {
              // 'direct' or 'merge'
              setRooms(updatedRooms);
              setItems(function(prev) { return newItems.concat(prev); });
              showToast('Converted & added ' + newItems.length + ' items across ' + Object.keys(importPreview.roomCounts).length + ' facilities directly to inventory!', 'success');
            }
          }

          setImportPreview(null);
          setSelectedRoomId('ALL');
        }

        // ============================================================
        // EXCEL EXPORT (HIGH-CRAFT UI DESIGN SYSTEM + SHEETJS FALLBACK)
        // ============================================================
        async function handleExcelExport(mode) {
          setIsExportDropdownOpen(false);

          // Determine columns to export based on system configuration
          var activeCols = (visibleColumns && visibleColumns.length > 0) ? visibleColumns : DEFAULT_COLUMNS;
          
          // Ensure Room column is represented
          var exportCols = [];
          var hasRoomCol = false;
          activeCols.forEach(function(c) {
            if (c.id === 'room' || c.id === 'roomId' || c.id === 'roomLocation') {
              hasRoomCol = true;
              exportCols.push({ id: '_room', label: c.label || 'ROOM / FACILITY', width: 34, align: 'left' });
            } else if (c.id === 'name') {
              exportCols.push({ id: 'name', label: c.label || 'ITEM NAME & DESCRIPTION', width: 56, align: 'left', indent: 1 });
            } else if (c.id === 'category') {
              exportCols.push({ id: 'category', label: c.label || 'CATEGORY', width: 34, align: 'left' });
            } else if (c.id === 'quantity') {
              exportCols.push({ id: 'quantity', label: c.label || 'QUANTITY', width: 20, align: 'right', isNumber: true });
            } else if (c.id === 'units') {
              exportCols.push({ id: 'units', label: c.label || 'UNITS', width: 18, align: 'center' });
            } else if (c.id === 'status' || c.id === 'condition') {
              exportCols.push({ id: 'status', label: c.label || 'STATUS / CONDITION', width: 24, align: 'center', isStatus: true });
            } else {
              var w = Math.max(22, (c.label || '').length * 1.5 + 4);
              exportCols.push({ id: c.id, label: c.label, width: w, align: c.type === 'number' ? 'right' : 'left', isNumber: c.type === 'number' });
            }
          });

          // If Room column wasn't explicitly in activeCols, append it as institutional standard (Column F)
          if (!hasRoomCol) {
            exportCols.push({ id: '_room', label: 'ROOM / FACILITY', width: 34, align: 'left' });
          }

          var numCols = exportCols.length;
          function getColLetter(colIdx1Based) {
            var letter = '';
            var temp = colIdx1Based;
            while (temp > 0) {
              var mod = (temp - 1) % 26;
              letter = String.fromCharCode(65 + mod) + letter;
              temp = Math.floor((temp - mod) / 26);
            }
            return letter;
          }
          var lastColLetter = getColLetter(numCols);

          // Status Badge Style Resolver matching ConditionBadge.tsx exactly
          function getStatusBadgeStyle(rawVal) {
            var st = String(rawVal || '').trim();
            if (st === 'Working' || st === 'Good') {
              return {
                bg: 'FFDCFCE7',   // Emerald-100 soft green pill
                font: 'FF15803D', // Emerald-700 deep green bold
                border: 'FFA7F3D0'// Emerald-200
              };
            }
            if (st === 'Used' || st === 'Fair') {
              return {
                bg: 'FFFEF3C7',   // Amber-100 soft amber pill
                font: 'FFB45309', // Amber-700 deep amber bold
                border: 'FFFDE68A'// Amber-200
              };
            }
            if (st === 'Defective' || st === 'Condemned' || st === 'Needs Repair') {
              return {
                bg: 'FFFFE4E6',   // Rose-100 soft rose pill
                font: 'FFBE123C', // Rose-700 deep red bold
                border: 'FFFECDD3'// Rose-200
              };
            }
            if (st === 'Incomplete') {
              return {
                bg: 'FFFFEDD5',   // Orange-100 soft orange pill
                font: 'FFC2410C', // Orange-700 deep orange bold
                border: 'FFFED7AA'// Orange-200
              };
            }
            if (st === 'Empty') {
              return {
                bg: 'FFF1F5F9',   // Slate-100 soft gray pill
                font: 'FF475569', // Slate-600 bold
                border: 'FFCBD5E1'// Slate-300
              };
            }
            return {
              bg: 'FFF8FAFC',
              font: 'FF334155',
              border: 'FFE2E8F0'
            };
          }

          function getCleanBase64(b64) {
            if (!b64) return null;
            return String(b64).replace(/^data:image\/[a-zA-Z0-9.+_-]+;base64,/, '').trim();
          }

          if (window.ExcelJS) {
            try {
              var workbook = new ExcelJS.Workbook();
              workbook.creator = "KM100 Skills and Training Center, Inc.";
              workbook.lastModifiedBy = "KM100 Inventory System";
              workbook.created = new Date();

              var km100LogoB64 = window.KM100_LOGO_B64 || null;
              var tesdaLogoB64 = null; // Removed per institutional branding update

              var km100ImgId = null;
              if (km100LogoB64) {
                try {
                  km100ImgId = workbook.addImage({ base64: getCleanBase64(km100LogoB64), extension: 'png' });
                } catch(imgErr1) {
                  console.warn('KM100 logo addImage warning:', imgErr1);
                }
              }
              var tesdaImgId = null;
              if (tesdaLogoB64) {
                try {
                  tesdaImgId = workbook.addImage({ base64: getCleanBase64(tesdaLogoB64), extension: 'png' });
                } catch(imgErr2) {
                  console.warn('TESDA logo addImage warning:', imgErr2);
                }
              }

              function populateWorksheet(ws, sheetTitle, sheetItems, tabColorHex, isFilteredView) {
                // Dynamic optimal column widths calculation
                var computedCols = exportCols.map(function(c) {
                  var maxLen = (c.label || '').length;
                  sheetItems.forEach(function(item) {
                    var val = '';
                    if (c.id === '_room') {
                      var roomObj = rooms.find(function(r) { return r.id === item.roomId; });
                      val = item.room || (roomObj ? roomObj.name : '');
                    } else if (c.id === 'status') {
                      val = item.status || item.condition || '';
                    } else {
                      val = item[c.id] !== undefined ? String(item[c.id]) : '';
                    }
                    if (val.length > maxLen) maxLen = val.length;
                  });
                  var optimalWidth = Math.max(c.width || 20, Math.min(68, maxLen + 6));
                  return { key: c.id, width: optimalWidth };
                });

                ws.columns = computedCols;

                // Freeze Panes: Lock Rows 1-6 so header remains sticky on scroll

                subCell.alignment = { vertical: 'middle', horizontal: 'center' };

                // Row 4: Official Report Heading
                ws.mergeCells('B4:' + getColLetter(numCols - 1) + '4');
                var reportCell = ws.getCell('B4');
                reportCell.value = "OFFICIAL PHYSICAL INVENTORY REPORT & ASSET REGISTER";
                reportCell.font = { name: 'Calibri', size: 11, bold: true, color: { argb: 'FF1E3A8A' } };

                // Row 5: Metadata (Room & Timestamp)

                metaCell.value = "Facility Location: " + sheetTitle + "   |   Active Catalog: " + sheetItems.length + " items   |   Exported: " + todayStr;

                // Clean double bottom border under Row 5
