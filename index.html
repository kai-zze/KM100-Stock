    <!-- Permanent Institutional Light Mode & Performance Extension Hardening -->

      (function () {
        try {
          localStorage.removeItem("km100_inventory_theme_v2");
          localStorage.removeItem("km100_inventory_theme_v1");
        } catch (e) {}
        document.documentElement.classList.remove("dark");
        document.documentElement.style.colorScheme = "light";

        // Neutralize extension hooks (such as React DevTools installHook.js) from triggering forced layout reflows
        try {
          if (typeof window.__REACT_DEVTOOLS_GLOBAL_HOOK__ === "object") {
            window.__REACT_DEVTOOLS_GLOBAL_HOOK__.isDisabled = true;
            for (var prop in window.__REACT_DEVTOOLS_GLOBAL_HOOK__) {
              if (prop === "renderers") {
                window.__REACT_DEVTOOLS_GLOBAL_HOOK__[prop] = new Map();
              } else if (
                typeof window.__REACT_DEVTOOLS_GLOBAL_HOOK__[prop] ===
                "function"
              ) {
                window.__REACT_DEVTOOLS_GLOBAL_HOOK__[prop] = function () {};
              }
            }
          }
        } catch (e) {}
      })();
    </script>

      .uiverse-scrolling-loader {
        --loader-font-size: var(--main-size, clamp(1.4rem, 4.2vw, 2.75rem));
        --text-color: #0f172a;
        --shine-color: rgba(15, 23, 42, 0.08);

        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        position: relative;
        font-size: var(--loader-font-size);
        font-weight: 900;
        text-transform: uppercase;
        color: var(--text-color);
        width: 7.5em;
        max-width: 92vw;
        height: 2.2em;
        filter: drop-shadow(0 0 0.05em var(--shine-color));
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
        letter-spacing: 0.04em;
      }

      .uiverse-scrolling-loader .uiverse-text {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        position: absolute;
      }

      .uiverse-scrolling-loader .uiverse-text:nth-child(1) {
        clip-path: polygon(0% 0%, 11.11% 0%, 11.11% 100%, 0% 100%);
        font-size: calc(var(--loader-font-size) * 0.5);
        margin-left: -2.1em;
        opacity: 0.6;
      }

      .uiverse-scrolling-loader .uiverse-text:nth-child(2) {
        clip-path: polygon(11.11% 0%, 22.22% 0%, 22.22% 100%, 11.11% 100%);
        font-size: calc(var(--loader-font-size) * 0.625);
        margin-left: -0.98em;
        opacity: 0.7;
      }

      .uiverse-scrolling-loader .uiverse-text:nth-child(3) {
        clip-path: polygon(22.22% 0%, 33.33% 0%, 33.33% 100%, 22.22% 100%);
        font-size: calc(var(--loader-font-size) * 0.77);
        margin-left: -0.33em;
        opacity: 0.8;
      }

        margin-left: -0.05em;

        margin-left: 0em;

      .uiverse-scrolling-loader .uiverse-line {
        position: absolute;
        bottom: 0.15em;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        height: clamp(3px, 0.45vw, 5px);
        width: 5.5em;
        max-width: 85%;
        border-radius: 9999px;
      }

      .uiverse-scrolling-loader .uiverse-line::before {
        content: "";
        position: absolute;
        height: 100%;
        width: 100%;
        background-color: var(--text-color);
        opacity: 0.15;
        border-radius: 9999px;
      }

      .uiverse-scrolling-loader .uiverse-line::after {
        content: "";
        position: absolute;
        height: 100%;
        width: 100%;
        background-color: var(--accent-color, #b45309);
        border-radius: 9999px;
        transform: translateX(-90%);
        animation: uiverse-wobble 2s cubic-bezier(0.5, 0.8, 0.5, 0.2) infinite;
      }

      @keyframes uiverse-wobble {
        0% {
          transform: translateX(-90%);
        }
        50% {
          transform: translateX(90%);
        }
        100% {
          transform: translateX(-90%);
        }
      }

      @keyframes uiverse-scrolling {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      @keyframes uiverse-shadow {
        0% {
          background-position: -98% 0;
        }
        100% {
          background-position: 102% 0;
        }
      }

      /* Print Styles for Formal Institutional Inventory Audit & Asset Tag Stickers */
      @media print {
        html,
        body,
        #root,
        #root > div {
          height: auto !important;

          overflow: visible !important;
          background: white !important;

        header.no-print,
        aside,

        [role="alertdialog"],
        button,
        input,
        select,
        .animate-toast,
        .floating-bar {
          display: none !important;

        /* Hide all screen-only content; reveal only the formal audit report by default */
        #root > div > *:not(#printable-report) {
          display: none !important;

        main {
          display: none !important;
        }
        #printable-report {
          display: block !important;
          position: static !important;
          width: 100% !important;
          padding: 0 !important;
          margin: 0 !important;

        .print-only {

        }

        /* Exact background colors and borders in print */
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* Multi-page table headers repeat cleanly */
        thead {

          border: 2px solid #000 !important;

          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }
      }
      .print-only {
        display: none;
