    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "#organization",
            "name": "KM100 Skills and Training Center, Inc.",
            "url": "/",
            "logo": "/logo.png",
            "description": "Skills and training center providing technical and vocational education."
          },
          {
            "@type": "WebApplication",
            "name": "KM100 Inventory Management System",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Any",
            "description": "Official inventory management system for tracking facility assets, equipment, quantities and conditions.",
            "isAccessibleForFree": true,
            "publisher": { "@id": "#organization" }
          }
        ]
      }
    </script>

    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Mobile Web App Support for iOS & Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KM100 Stock" />
    <link rel="apple-touch-startup-image" href="/icon-512.png" />

    <!-- Permanent Institutional Light Mode & Performance Extension Hardening -->
    <script>
      (function () {
        try {
          localStorage.removeItem("km100_inventory_theme_v2");
          localStorage.removeItem("km100_inventory_theme_v1");
        } catch (e) {}
        document.documentElement.classList.remove("dark");
        document.documentElement.style.colorScheme = "light";

        // Neutralize extension hooks (such as React DevTools installHook.js) from triggering forced layout reflows
        try {
          if (typeof window.__REACT_DEVTOOLS_GLOBAL_HOOK__ === "object") {
            window.__REACT_DEVTOOLS_GLOBAL_HOOK__.isDisabled = true;
            for (var prop in window.__REACT_DEVTOOLS_GLOBAL_HOOK__) {
              if (prop === "renderers") {
                window.__REACT_DEVTOOLS_GLOBAL_HOOK__[prop] = new Map();
              } else if (
                typeof window.__REACT_DEVTOOLS_GLOBAL_HOOK__[prop] ===
                "function"
              ) {
                window.__REACT_DEVTOOLS_GLOBAL_HOOK__[prop] = function () {};
              }
            }
          }
        } catch (e) {}
      })();
    </script>

    <!-- Typography: Plus Jakarta Sans (Headings) & DM Sans (Body) via Google Fonts.
       Loaded asynchronously so the font stylesheet never blocks first paint. -->
    <!-- Preconnect to Font & Cloud CDN Endpoints for Instant First Paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preconnect"
      href="https://kpzancwkmbhnuqbnqrii.supabase.co"
      crossorigin
    />
    <link rel="dns-prefetch" href="https://kpzancwkmbhnuqbnqrii.supabase.co" />
    <link
      rel="preload"
      as="image"
      href="/logo-sm.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    /></noscript>

    <style>
      /* Critical shell styles. Application styling lives in src/index.css. */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      }

      @keyframes km100-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes km100-pulse-subtle {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.025);
          opacity: 0.96;
        }
      }

      @keyframes km100-progress {
        0% {
          left: -40%;
          width: 40%;
        }
        50% {
          left: 20%;
          width: 60%;
        }
        100% {
          left: 100%;
          width: 40%;
        }
      }

      /* Print Styles for Formal Institutional Inventory Audit & Asset Tag Stickers */
      @media print {
        html,
        body,
        #root,
        #root > div {
          height: auto !important;
          min-height: 100% !important;
          overflow: visible !important;
          background: white !important;
          color: black !important;
        }
        header.no-print,
        aside,
        .no-print,
        [role="alertdialog"],
        button,
        input,
        select,
        .animate-toast,
        .floating-bar {
          display: none !important;
        }
        /* Hide all screen-only content; reveal only the formal audit report by default */
        #root > div > *:not(#printable-report) {
          display: none !important;
        }
        main {
          display: none !important;
        }
        #printable-report {
          display: block !important;
          position: static !important;
          width: 100% !important;
          padding: 0 !important;
          margin: 0 !important;
        }
        .print-only {
          display: block !important;
        }
        [role="dialog"] {
          display: none !important;
        }

        /* Exact background colors and borders in print */
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* Multi-page table headers repeat cleanly */
        thead {
          display: table-header-group !important;
        }
        tr {
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }

        @page {
          size: letter portrait;
          margin: 0.5in;
          @bottom-center {
            content: "KM100 Skills and Training Center, Inc. — Page "
              counter(page) " of " counter(pages);
            font-size: 8pt;
            color: #666;
          }
        }

        /* Asset Tag Sticker Specific Print Mode */
        body.print-asset-tag #printable-report {
          display: none !important;
        }
        body.print-asset-tag #root > div {
          display: none !important;
        }
        body.print-asset-tag .asset-tag-overlay {
          display: flex !important;
          position: static !important;
          background: transparent !important;
          padding: 0 !important;
          margin: 0 !important;
        }
        body.print-asset-tag .asset-tag-overlay > div {
          box-shadow: none !important;
          border: none !important;
          padding: 0 !important;
          max-width: 100% !important;
          background: transparent !important;
        }
        body.print-asset-tag .asset-tag-controls {
          display: none !important;
        }
        body.print-asset-tag .asset-tag-sticker {
          display: block !important;
          width: 3.5in !important;
          margin: 0 auto !important;
          padding: 12px !important;
          border: 2px solid #000 !important;
          border-radius: 8px !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }
      }
      .print-only {
        display: none;
      }
    </style>
  </head>
  <body
    class="h-full bg-slate-50 text-slate-900 antialiased selection:bg-amber-600 selection:text-white"
  >
    <noscript>
      <div
        style="
          max-width: 640px;
          margin: 0 auto;
          padding: 48px 20px;
          font-family: system-ui, sans-serif;
          line-height: 1.6;
        "
      >
        <h1 style="margin: 0 0 12px; font-size: 24px">
          KM100 Inventory Management System
        </h1>
        <p style="margin: 0; color: #475569">
          Official asset and property register for KM100 Skills and Training
          Center, Inc. The inventory management system tracks equipment,
          quantities and conditions across facilities, with Excel import/export
          and cloud sync. Please enable JavaScript to use the application.
        </p>
      </div>
    </noscript>
    <div id="root" class="h-full">
      <!-- Institutional Pre-loader Splash Screen (Replaced by React on mount) -->
      <div
        id="initial-loading"
        style="
          position: fixed;
          inset: 0;
          width: 100%;
          height: 100dvh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #ffffff;
          font-family:
            &quot;Plus Jakarta Sans&quot;,
            system-ui,
            -apple-system,
            sans-serif;
          text-align: center;
          padding: 24px;
          box-sizing: border-box;
          overflow: hidden;
          z-index: 9999;
          user-select: none;
          -webkit-user-select: none;
        "
      >
        <!-- Institutional Top Accent Line -->
        <div
          style="
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(
              90deg,
              #b45309 0%,
              #ea580c 50%,
              #f59e0b 100%
            );
          "
        ></div>

        <!-- Official Circular Logo Emblem with Architectural Ring & Subtle Breathing Pulse -->
        <div
          style="
            position: relative;
            margin-bottom: 20px;
            animation: km100-pulse-subtle 3s ease-in-out infinite;
          "
        >
          <div
            style="
              width: 104px;
              height: 104px;
              border-radius: 50%;
              padding: 4px;
              background: #ffffff;
              box-shadow:
                0 14px 30px -8px rgba(180, 83, 9, 0.22),
                0 4px 12px -2px rgba(0, 0, 0, 0.05);
              border: 2px solid #fed7aa;
              display: flex;
              align-items: center;
              justify-content: center;
              margin: 0 auto;
            "
          >
            <picture>
              <source type="image/webp" srcset="/logo-sm.webp" />
              <img
                src="/logo-sm.png"
                width="96"
                height="96"
                decoding="async"
                fetchpriority="high"
                alt="KM100 Logo"
                style="
                  width: 96px;
                  height: 96px;
                  border-radius: 50%;
                  object-fit: contain;
                  display: block;
                "
                onerror="this.style.display = 'none'"
              />
            </picture>
          </div>
        </div>

        <!-- Official Security & Custody Pill -->
        <div
          style="
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            background: #fffbeb;
            border: 1px solid #fef3c7;
            border-radius: 9999px;
            margin-bottom: 12px;
          "
        >
          <span
            style="
              width: 6px;
              height: 6px;
              border-radius: 50%;
              background: #b45309;
              display: inline-block;
            "
          ></span>
          <span
            style="
              font-size: 11px;
              font-weight: 700;
              color: #92400e;
              letter-spacing: 0.06em;
              text-transform: uppercase;
            "
          >
            Official Property Custody
          </span>
        </div>

        <!-- Institutional Titles -->
        <h1
          style="
            margin: 0;
            color: #0f172a;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.025em;
            line-height: 1.3;
            max-width: 320px;
          "
        >
          KM100 SKILLS AND TRAINING CENTER, INC.
        </h1>
        <p
          style="
            margin: 6px 0 0 0;
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
            font-family: &quot;DM Sans&quot;, system-ui, sans-serif;
            letter-spacing: -0.01em;
          "
        >
          Property Custody &amp; Inventory Management System
        </p>

        <!-- Animated Progress Indicator Track -->
        <div
          style="
            margin-top: 26px;
            width: 140px;
            height: 3px;
            background: #f1f5f9;
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
          "
        >
          <div
            style="
              position: absolute;
              top: 0;
              bottom: 0;
              background: linear-gradient(90deg, #b45309, #f59e0b);
              border-radius: 9999px;
              animation: km100-progress 1.4s ease-in-out infinite;
            "
          ></div>
        </div>
        <p
          style="
            margin: 10px 0 0 0;
            color: #94a3b8;
            font-size: 11.5px;
            font-weight: 500;
            font-family: &quot;DM Sans&quot;, system-ui, sans-serif;
            letter-spacing: 0.02em;
          "
        >
          Initializing inventory workspace...
        </p>

        <!-- Bottom Institutional Anchor -->
        <div
          style="
            position: absolute;
            bottom: 24px;
            left: 0;
            right: 0;
            text-align: center;
            padding: 0 16px;
          "
        >
          <span
            style="
              font-size: 10.5px;
              font-weight: 600;
              color: #94a3b8;
              letter-spacing: 0.05em;
              text-transform: uppercase;
              font-family: &quot;DM Sans&quot;, system-ui, sans-serif;
            "
          >
            TESDA Regulated &bull; Institutional Property Register
          </span>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
