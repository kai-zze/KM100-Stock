    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #0f172a;
        font-family:
          "Plus Jakarta Sans",
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: #0f172a;
        line-height: 1.4;
        padding: 24px 16px;
      }

      .screen-toolbar {
        position: sticky;
        top: 0;
        z-index: 9999;
        max-width: 12.5in;
        margin: 0 auto 20px auto;
        background: #1e293b;
        padding: 14px 24px;
        border-radius: 10px;
        border: 1px solid #334155;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .toolbar-info h2 {
        font-size: 16px;
        font-weight: 800;
        color: #ffffff;
      }

      .toolbar-info p {
        font-size: 13px;
        color: #94a3b8;
      }

      .print-btn {
        background: #b45309;
        color: #ffffff;
        border: none;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 700;
        border-radius: 8px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: background 0.15s ease;
      }

      .print-btn:hover {
        background: #92400e;
      }

      .slide-page {
        max-width: 12.5in;
        margin: 0 auto;
        background: #ffffff;
        padding: 16px;
        border-radius: 12px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
      }

      .slide-page svg {
        width: 100%;
        height: auto;
        display: block;
      }

      @media print {
        @page {
          size: letter landscape;
          margin: 0;
        }
        body {
          background: #ffffff !important;
          padding: 0 !important;
        }
        .screen-toolbar {
          display: none !important;
        }
        .slide-page {
          max-width: 100% !important;
          margin: 0 !important;
          padding: 0.25in !important;
          box-shadow: none !important;
          border-radius: 0 !important;
        }
      }
    </style>
  </head>
