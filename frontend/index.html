<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>KM100 Inventory Management System</title>

  <!-- SEO -->
  <meta name="description" content="Official inventory management system for KM100 Skills and Training Center, Inc. Track assets, equipment, quantities and conditions across facilities with Excel import/export and cloud sync.">
  <meta name="robots" content="index, follow">
  <meta name="author" content="KM100 Skills and Training Center, Inc.">
  <meta name="application-name" content="KM100 Inventory Management System">
  <meta name="theme-color" content="#b45309">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="KM100 Inventory Management System">
  <meta property="og:title" content="KM100 Inventory Management System">
  <meta property="og:description" content="Official inventory management system for KM100 Skills and Training Center, Inc. Track assets, equipment, quantities and conditions across facilities.">
  <meta property="og:image" content="/logo.png">
  <meta property="og:image:alt" content="KM100 Skills and Training Center, Inc. logo">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="KM100 Inventory Management System">
  <meta name="twitter:description" content="Official inventory management system for KM100 Skills and Training Center, Inc. Track assets, equipment, quantities and conditions across facilities.">
  <meta name="twitter:image" content="/logo.png">

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "#organization",
        "name": "KM100 Skills and Training Center, Inc.",
        "url": "/",
        "logo": "/logo.png",
        "description": "Skills and training center providing technical and vocational education."
      },
      {
        "@type": "WebApplication",
        "name": "KM100 Inventory Management System",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any",
        "description": "Official inventory management system for tracking facility assets, equipment, quantities and conditions.",
        "isAccessibleForFree": true,
        "publisher": { "@id": "#organization" }
      }
    ]
  }
  </script>

  <link rel="icon" type="image/png" href="/favicon.png?v=4">
  <link rel="apple-touch-icon" href="/logo.png">

  <!-- Permanent Institutional Light Mode -->
  <script>
    (function () {
      try {
        localStorage.removeItem('km100_inventory_theme_v2');
        localStorage.removeItem('km100_inventory_theme_v1');
      } catch (e) {}
      document.documentElement.classList.remove('dark');
    })();
  </script>

  <!-- High-Performance Typography: Preconnected & Immediate (0.000 CLS) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="image" href="/logo.png" fetchpriority="high">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=optional">

  <style>
    /* Critical Shell Styles for 0ms First Paint & Zero CLS */
    * { box-sizing: border-box; }
    html { color-scheme: light; margin: 0; height: 100%; }
    body { font-family: 'DM Sans', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; color: #0f172a; }
    h1, h2, h3, h4, h5, h6 { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }

    @keyframes km100-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .skeleton-box {
      animation: km100-pulse 1.5s ease-in-out infinite;
      background-color: #e2e8f0;
      border-radius: 8px;
    }

    /* Print Styles for Formal Institutional Inventory Audit & Asset Tag Stickers */
    @media print {
      html, body, #root, #root > div {
        height: auto !important;
        min-height: 100% !important;
        overflow: visible !important;
        background: white !important;
        color: black !important;
      }
      header, aside, .no-print, [role="alertdialog"], button, input, select, .animate-toast, .floating-bar {
        display: none !important;
      }
      #root > div > *:not(#printable-report) { display: none !important; }
      main { display: none !important; }
      #printable-report {
        display: block !important;
        position: static !important;
        width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .print-only { display: block !important; }
      [role="dialog"] { display: none !important; }
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      thead { display: table-header-group !important; }
      tr { page-break-inside: avoid !important; break-inside: avoid !important; }
      @page {
        size: letter portrait;
        margin: 0.5in;
      }
      body.print-asset-tag #printable-report { display: none !important; }
      body.print-asset-tag #root > div { display: none !important; }
      body.print-asset-tag .asset-tag-overlay {
        display: flex !important;
        position: static !important;
        background: transparent !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      body.print-asset-tag .asset-tag-overlay > div {
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        max-width: 100% !important;
        background: transparent !important;
      }
      body.print-asset-tag .asset-tag-controls { display: none !important; }
      body.print-asset-tag .asset-tag-sticker {
        display: block !important;
        width: 3.5in !important;
        margin: 0 auto !important;
        padding: 12px !important;
        border: 2px solid #000 !important;
        border-radius: 8px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }
    .print-only { display: none; }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-900 antialiased selection:bg-amber-600 selection:text-white">
  <noscript>
    <div style="max-width: 640px; margin: 0 auto; padding: 48px 20px; font-family: system-ui, sans-serif; line-height: 1.6;">
      <h1 style="margin: 0 0 12px; font-size: 24px;">KM100 Inventory Management System</h1>
      <p style="margin: 0; color: #475569;">Official asset and property register for KM100 Skills and Training Center, Inc. The inventory management system tracks equipment, quantities and conditions across facilities, with Excel import/export and cloud sync. Please enable JavaScript to use the application.</p>
    </div>
  </noscript>

  <div id="root" class="h-full">
    <!-- Instant 1:1 Geometric Layout Skeleton: Guarantees 0.00 CLS and Sub-400ms FCP/LCP -->
    <div style="display: flex; height: 100vh; flex-direction: column; background-color: #f8fafc;">
      <!-- Shell Header -->
      <header style="height: 64px; flex-shrink: 0; border-bottom: 1px solid #e2e8f0; background: rgba(255,255,255,0.95); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <img src="/logo.png" width="40" height="40" alt="KM100 Logo" style="width: 40px; height: 40px; object-fit: contain; border-radius: 12px;" decoding="async" fetchpriority="high">
          <div>
            <h1 style="margin: 0; font-size: 16px; font-weight: 800; line-height: 1.2; color: #0f172a;">
              <span style="color: #c2410c;">KM</span>100 Skills and Training Center, Inc.
            </h1>
            <p style="margin: 2px 0 0; font-size: 12px; color: #64748b; font-weight: 500;">
              Inventory Management System
            </p>
          </div>
        </div>
        <div style="display: flex; gap: 8px;">
          <div class="skeleton-box" style="width: 90px; height: 32px;"></div>
          <div class="skeleton-box" style="width: 110px; height: 32px; background-color: #fde68a;"></div>
        </div>
      </header>

      <!-- Shell Body -->
      <div style="display: flex; flex: 1; overflow: hidden;">
        <!-- Shell Sidebar -->
        <aside style="width: 256px; flex-shrink: 0; border-right: 1px solid #e2e8f0; background: #ffffff; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
          <div class="skeleton-box" style="width: 100px; height: 16px; margin-bottom: 8px;"></div>
          <div class="skeleton-box" style="width: 100%; height: 38px; background-color: #fef3c7;"></div>
          <div class="skeleton-box" style="width: 100%; height: 38px;"></div>
          <div class="skeleton-box" style="width: 100%; height: 38px;"></div>
          <div class="skeleton-box" style="width: 100%; height: 38px;"></div>
        </aside>

        <!-- Shell Main Content -->
        <main style="flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">
          <!-- 4 Stats Cards -->
          <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;">
            <div style="height: 90px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between;">
              <div class="skeleton-box" style="width: 60px; height: 12px;"></div>
              <div class="skeleton-box" style="width: 40px; height: 24px;"></div>
            </div>
            <div style="height: 90px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between;">
              <div class="skeleton-box" style="width: 75px; height: 12px;"></div>
              <div class="skeleton-box" style="width: 40px; height: 24px;"></div>
            </div>
            <div style="height: 90px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between;">
              <div class="skeleton-box" style="width: 80px; height: 12px;"></div>
              <div class="skeleton-box" style="width: 40px; height: 24px;"></div>
            </div>
            <div style="height: 90px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between;">
              <div class="skeleton-box" style="width: 60px; height: 12px;"></div>
              <div class="skeleton-box" style="width: 40px; height: 24px;"></div>
            </div>
          </div>

          <!-- Search toolbar skeleton -->
          <div style="height: 44px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; display: flex; align-items: center; padding: 0 14px;">
            <div class="skeleton-box" style="width: 180px; height: 14px;"></div>
          </div>

          <!-- Table skeleton -->
          <div style="flex: 1; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
            <div class="skeleton-box" style="height: 32px;"></div>
            <div class="skeleton-box" style="height: 38px; background-color: #f1f5f9;"></div>
            <div class="skeleton-box" style="height: 38px; background-color: #f8fafc;"></div>
            <div class="skeleton-box" style="height: 38px; background-color: #f1f5f9;"></div>
            <div class="skeleton-box" style="height: 38px; background-color: #f8fafc;"></div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
